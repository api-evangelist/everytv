aid: everytv
name: Every.tv
description: 'Every, Inc. (株式会社エブリー, corp.every.tv) is a Tokyo-based Japanese
  video-media and advertising company that runs consumer lifestyle products including
  DELISH KITCHEN (recipe video media), retailHUB (a retail promotion and data platform
  connecting physical stores with digital channels), トモニテ / Tomonite (parenting
  video media and community), and MOMENTH (a professional video production and social
  team). Led by CEO Taissei Yoshida and headquartered in Roppongi, Minato, Tokyo,
  the company approached an IPO on the Tokyo Stock Exchange Growth Market. It was
  surfaced as a portfolio company of dcm-ventures and added to the API Evangelist
  network for enrichment. Every, Inc. publishes an engineering blog and owned media
  but exposes no public developer API program.'
